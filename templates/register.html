{% extends "base.html" %}{% block body %}
<div class="card narrow"><h2>Student Registration</h2>
<form method="post">
<div class="row"><div><label>Last name</label><input name="last_name" required></div>
<div><label>First name</label><input name="first_name" required></div>
<div class="mi"><label>MI</label><input name="mi" maxlength="1" required></div></div>
<label>Gmail</label><input name="email" type="email" pattern=".+@gmail\.com" title="Must be a @gmail.com address" required>
<div class="row"><div><label>Password (min 8)</label><input name="password" type="password" minlength="8" required></div>
<div><label>Confirm password</label><input name="confirm" type="password" minlength="8" required></div></div>
<div class="row"><div><label>Course</label><select name="course" id="course">{% for c in courses %}<option>{{ c }}</option>{% endfor %}</select></div>
<div><label>Year level</label><select name="year">{% for y in [1,2,3,4] %}<option>{{ y }}</option>{% endfor %}</select></div>
<div id="sw"><label>Section</label><select name="section"><option>A</option><option>B</option><option>C</option></select></div>
<div id="mw" hidden><label>Major</label><select name="major">{% for m in majors %}<option>{{ m }}</option>{% endfor %}</select></div></div>
<button class="btn p">Submit registration</button></form></div>{% endblock %}
{% block js %}<script>
const c=document.getElementById('course');
function t(){const b=c.value==='BSED';document.getElementById('sw').hidden=b;document.getElementById('mw').hidden=!b}
c.onchange=t;t();
</script>{% endblock %}
